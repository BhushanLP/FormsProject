
<form [formGroup]="myForm" (ngSubmit)="onSubmit()">
<div class="col-6">
    <label for="name">Name</label>
    <input type="text" id="name" formControlName="name"> 
    <div *ngIf="myForm.controls['name'].invalid && (myForm.controls['name'].touched || myForm.controls['name'].dirty)" style="color:red">
           <!-- Only show required message if the 'required' error exists -->
    <span *ngIf="myForm.controls['name'].errors?.['required']">
        Name is required.
    </span>
    
    <!-- Only show minlength message if the 'minlength' error exists -->
    <span *ngIf="myForm.controls['name'].errors?.['minlength']">
     at least 3 characters long name required.
    </span>
    </div>
</div>
<div class="col-6">
    <label for="contact">Contact</label>
    <input type="number" id="contact" formControlName="contact">
</div>

<div formArrayName="email">
<div *ngFor="let x of email.controls, index as i" formGroupName="i">
<label for="myEmail">myEmail{{i + 1}}</label>
    <input type="text" formControlName="myEmail">
<label for="myData">myData{{i + 1}}</label>
    <input type="text" formControlName="myData">
</div>
</div>
<button type="button" (click)="onEmailAdd()">Add Email</button>
<button type="button" (click)="onEmailremove()">Remove Email</button>

<button type="submit" [disabled]="myForm.invalid">Submit</button>
</form>
<h1>Form Value:{{myForm.value | json}}</h1>
