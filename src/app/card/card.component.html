<div class="container">
    <div class="items1" style="width:100px;height:100px;background-color:red;">Item 1</div>
    <div class="items2" style="width:100px;height:100px;background-color:pink;">Item 2</div>
    <div class="items3" style="width:100px;height:100px;background-color:yellow;">Item 3</div>
</div>
<br><br>
<div class="card">
  <h5 class="card-header">Featured</h5>
  <div class="card-body">
    <h5 class="card-title">Special title treatment</h5>
    <p class="card-text">With supporting text below as a natural lead-in to additional content.</p>
    <a href="#" class="btn btn-primary">Go somewhere</a>
  </div>
</div>

 <form [formGroup]="userForm" (ngSubmit)="submit()">
        <label for="name">Name</label>
        <input type="text" formControlName="name" />
        <div
          *ngIf="
            userForm.get('name')?.invalid &&
            (userForm.get('name')?.touched || userForm.get('name')?.dirty)
          "
        >
          <span *ngIf="userForm.get('name')?.errors?.['required']"
            >Name is Required</span
          >
          <span *ngIf="userForm.get('name')?.errors?.['minlength']"
            >Name minLength is 3</span
          >
        </div>

        <label for="lname">LName</label>
        <input type="text" formControlName="lname" />
        <div
          *ngIf="
            userForm.get('lname')?.invalid &&
            (userForm.get('lname')?.touched || userForm.get('lname')?.dirty)
          "
        >
          <span *ngIf="userForm.get('lname')?.errors?.['required']">
            LName is Required
          </span>

          <span *ngIf="userForm.get('lname')?.errors?.['minlength']">
            LName minlength is 3
          </span>
        </div>
        <div formArrayName="skills">
          <div *ngFor="let skill of getSkill().controls; let i = index">
            <input type="text" [formControlName]="i" />
            <button  type="button" (click)="remove(i)">-</button>
          </div>
        </div>

        <button type="button" (click)="addSkill()">
          Add Skill
        </button>
      
        <button type="submit">Submit</button>
      </form>
