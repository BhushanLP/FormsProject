  <option *ngFor="let item of dropdowndata">{{item}}</option>

<div class="overlay" *ngIf="isLoading">
<div class="center">
        <div diameter=50 mode="indeterminate" color="primary">
        </div>
      </div>
    </div>
    <div class="container">
      <div class="row">
        
        <button type="button" class="btn btn-primary" (click)="increment()">Increment</button>

        <button type="button" class="btn btn-secondary" (click)="decrement()">Decrement</button>
    </div>
</div>
