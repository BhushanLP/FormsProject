<div class="container text-center">
    <div class="row">
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <div class="container">
                        COUNT : {{count()}}
                        DoubleCOUNT : {{double()}}
                    </div>
                    <div class="container">
                        <div class="row">
                            <button type="button" class="btn btn-primary" (click)="increment()">Increment</button>
                            <button type="button" class="btn btn-secondary" (click)="decrement()">Decrement</button>
                        </div>
                    </div>

                    <ul>
                        <li *ngFor="let item of action">{{item}}</li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col">
            <div class="card">
                <div class="card-body">
                    <app-vaish [data]="hero" (mySuperHero)="superHero($event)"></app-vaish>
                </div>
            </div>
        </div>
    </div>
</div>

{{msggg}}
